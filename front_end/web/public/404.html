<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FlameGuard AI</title>
  <script>
    // SPA redirect trick for GitHub Pages + BrowserRouter
    // When GitHub Pages returns 404 for a client-side route, this script
    // redirects back to index.html with the path preserved in query string.
    var pathSegmentsToKeep = 1; // Keep /FlameGuard_AI/ prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
