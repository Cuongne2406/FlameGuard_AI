# render.yaml - Render.com deployment configuration
# Deploy backend API + PostgreSQL database

databases:
  - name: flameguard-db
    databaseName: flameguard_db
    user: flameguard
    plan: free

services:
  - type: web
    name: flameguard-api
    runtime: python
    rootDir: back_end
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flameguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        value: dtb6uvcw7
      - key: CLOUDINARY_API_KEY
        value: "598317716265961"
      - key: CLOUDINARY_API_SECRET
        value: 4rKmzQavOB7HQuI9uUbk4tqH0Ao
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      # Set these manually on Render dashboard:
      # MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
      - key: ALLOWED_ORIGINS
        value: https://cuongne2406.github.io
